apiVersion: apps/v1
kind: Deployment
metadata:
  name: love-you-fahh
  labels:
    app: love-you-fahh
spec:
  replicas: 10
  selector:
    matchLabels:
      app: love-you-fahh
  template:
    metadata:
      labels:
        app: love-you-fahh
    spec:
      containers:
      - name: love-you
        image: nahidbrodev/love-you:v5
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: love-you-fahh
spec:
  type: LoadBalancer
  selector:
    app: love-you-fahh
  ports:
  - port: 8000
    targetPort: 8000